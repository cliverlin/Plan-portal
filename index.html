<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기획 공유 포털</title>
  <meta name="description" content="기획 의도를 명확하게 전달하고 협업을 돕기 위한 OfficeKeeper 기획 공유 포털입니다." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="기획 공유 포털" />
  <meta property="og:title" content="기획 공유 포털" />
  <meta property="og:description" content="기획 의도를 명확하게 전달하고 협업을 돕기 위한 OfficeKeeper 기획 공유 포털입니다." />
  <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/favicon_io/site.webmanifest" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-blur"></div>

  <header class="topbar">
    <a href="./index.html" class="brand" style="text-decoration: none;">
      <div class="brand-text">
        <div class="brand-title">OfficeKeeper Plan Portal</div>
      </div>
    </a>
  </header>

  <div class="wrap">

    <div class="hero-glow">
      <h1 class="hero-glow-title">기획 공유 포털</h1>
      <div class="hero-glow-desc">
        기획 의도를 명확하게 전달하고 협업을 돕기 위한 공간입니다.
      </div>
    </div>

    <section class="section drive-publish-section" style="margin-top: 10px;">
      <h1 class="sr-only">Google Drive 게시 파일</h1>
      <div class="drive-toolbar">
        <label class="drive-search">
          <span class="sr-only">파일명 검색</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="driveSearch" type="search" placeholder="파일명 검색" autocomplete="off" />
        </label>
        <label class="drive-sort">
          <span class="sr-only">게시일 정렬</span>
          <select id="driveSort">
            <option value="desc">게시일 최신순</option>
            <option value="asc">게시일 오래된순</option>
          </select>
        </label>
        <button class="drive-refresh" id="driveRefresh" type="button">
          <svg class="drive-refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
          <span>목록 새로고침</span>
        </button>
        <div class="count" id="driveFileCount">총 0개</div>
      </div>

      <div class="sr-only" id="driveSyncStatus" role="status" aria-live="polite">게시 목록 확인 중</div>

      <div class="drive-file-list" id="driveFileList" aria-live="polite">
        <div class="drive-file-loading">Google Drive 게시 파일을 불러오고 있습니다.</div>
      </div>
    </section>

    <footer class="footer" style="justify-content: center;">
      <div>© OfficeKeeper Plan Portal</div>
    </footer>
  </div>

  <script src="./assets/js/drive-projects.js"></script>
  <script src="./assets/js/main.js"></script>
</body>

</html>
