<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>기획 공유 포털</title>
  <meta name="description" content="기획 의도를 명확하게 전달하고 협업을 돕기 위한 OfficeKeeper 기획 공유 포털입니다." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="기획 공유 포털" />
  <meta property="og:title" content="기획 공유 포털" />
  <meta property="og:description" content="기획 의도를 명확하게 전달하고 협업을 돕기 위한 OfficeKeeper 기획 공유 포털입니다." />
  <link rel="icon" type="image/x-icon" href="./assets/favicon_io/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon_io/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon_io/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon_io/apple-touch-icon.png" />
  <link rel="manifest" href="./assets/favicon_io/site.webmanifest" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>

<body>
  <div class="bg-grid"></div>
  <div class="bg-blur"></div>

  <header class="topbar">
    <a href="./index.html" class="brand" style="text-decoration: none;">
      <div class="brand-text">
        <div class="brand-title">OfficeKeeper Plan Portal</div>
      </div>
    </a>
  </header>

  <div class="wrap">

    <div class="hero-glow">
      <h1 class="hero-glow-title">기획 공유 포털</h1>
      <div class="hero-glow-desc">
        기획 의도를 명확하게 전달하고 협업을 돕기 위한 공간입니다.
      </div>
    </div>

    <section class="section drive-publish-section" style="margin-top: 10px;">
      <h1 class="sr-only">Google Drive 게시 파일</h1>
      <div class="drive-location">
        <nav class="drive-breadcrumbs" id="driveBreadcrumbs" aria-label="폴더 경로">
          <span class="drive-breadcrumb-icon" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2Z"/></svg></span>
          <span aria-current="page">게시용 공간</span>
        </nav>
        <span class="drive-preview-label" id="drivePreviewLabel" hidden>로컬 미리보기 · 예시 데이터</span>
      </div>
      <div class="drive-toolbar">
        <label class="drive-search">
          <span class="sr-only">파일명 검색</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="driveSearch" type="search" placeholder="파일명 검색" autocomplete="off" />
        </label>
        <label class="drive-owner-filter drive-select">
          <span class="sr-only">소유자 필터</span>
          <select id="driveOwner" title="현재 폴더의 파일 소유자별 필터 · 폴더는 계속 표시됩니다."><option value="">전체 소유자</option></select>
        </label>
        <label class="drive-sort">
          <span class="sr-only">게시일 정렬</span>
          <select id="driveSort">
            <option value="desc">게시일 최신순</option>
            <option value="asc">게시일 오래된순</option>
          </select>
        </label>
        <button class="drive-refresh" id="driveRefresh" type="button">
          <svg class="drive-refresh-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"/></svg>
          <span>목록 새로고침</span>
        </button>
        <div class="count" id="driveFileCount">총 0개</div>
      </div>

      <div class="sr-only" id="driveSyncStatus" role="status" aria-live="polite">게시 목록 확인 중</div>
      <div class="drive-list-heading" aria-hidden="true"><div class="drive-heading-fields"><span>이름</span><span>소유자</span><span>게시일</span></div><span></span></div>

      <div class="drive-file-list" id="driveFileList" aria-live="polite">
        <div class="drive-file-loading">Google Drive 게시 파일을 불러오고 있습니다.</div>
      </div>
    </section>

    <div class="drive-toast" id="driveToast" role="status" aria-live="polite" hidden></div>
    <dialog class="drive-copy-dialog" id="driveCopyDialog" aria-labelledby="driveCopyTitle">
      <h2 id="driveCopyTitle">파일 링크</h2>
      <p>자동 복사가 제한되어 있습니다. 아래 링크를 선택해 복사해 주세요.</p>
      <input id="driveCopyUrl" type="text" readonly aria-label="복사할 파일 링크" />
      <form method="dialog"><button type="submit">닫기</button></form>
    </dialog>
    <footer class="footer" style="justify-content: center;">
      <div>© OfficeKeeper Plan Portal</div>
    </footer>
  </div>

  <dialog class="file-preview-dialog" id="filePreviewDialog" aria-labelledby="filePreviewTitle">
    <header class="file-preview-header">
      <div class="file-preview-heading"><h2 id="filePreviewTitle"></h2><span id="filePreviewMeta" class="file-preview-meta"></span></div>
      <div class="file-preview-header-actions">
        <div id="filePreviewThemeTools" class="file-preview-theme" hidden role="group" aria-label="문서 보기 모드">
          <button id="filePreviewLight" type="button" aria-label="일반 모드" title="일반 모드" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
          <button id="filePreviewDark" type="button" aria-label="다크 모드" title="다크 모드" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg></button>
        </div>
        <button id="filePreviewClose" type="button" aria-label="미리보기 닫기">닫기 <span aria-hidden="true">×</span></button>
      </div>
    </header>
    <div class="file-preview-toolbar">
      <div id="filePreviewMarkdownTools" hidden><button id="filePreviewDocument" type="button" aria-pressed="true">문서 보기</button><button id="filePreviewRaw" type="button" aria-pressed="false">원문 보기</button></div>
      <div id="filePreviewImageTools" hidden><button id="filePreviewZoomOut" type="button" aria-label="이미지 축소">−</button><span id="filePreviewZoomLevel">맞춤</span><button id="filePreviewZoomIn" type="button" aria-label="이미지 확대">+</button><button id="filePreviewFit" type="button">화면에 맞춤</button></div>
      <div class="file-preview-actions"><button id="filePreviewCopy" type="button" title="PNG 이미지로 복사 · 움직이는 이미지는 한 장으로 복사됩니다" hidden disabled>이미지 복사</button><a id="filePreviewDownload" class="file-preview-download" hidden>다운로드</a><a id="filePreviewDrive" target="_blank" rel="noopener noreferrer" title="Google Drive에서 열기">Drive ↗</a></div>
    </div>
    <p id="filePreviewFeedback" class="file-preview-feedback" role="status" hidden></p>
    <p id="filePreviewStatus" class="file-preview-status" role="status"></p>
    <div id="filePreviewContent" class="file-preview-content" hidden>
      <div id="filePreviewImageArea" class="file-preview-image-area" hidden tabindex="0" role="region" aria-label="이미지 보기 · 확대한 이미지는 드래그하거나 방향키로 이동"><img id="filePreviewImage" alt="" draggable="false" /></div>
      <div id="filePreviewTextArea" class="file-preview-text-area" hidden><article id="filePreviewRendered" class="markdown-document"></article><pre id="filePreviewSource" hidden></pre></div>
    </div>
  </dialog>

  <script src="./assets/js/drive-projects.js"></script>
  <script src="./assets/js/drive-view.js"></script>
  <script src="./assets/js/drive-icons.js"></script>
  <script src="./assets/vendor/marked.umd.js"></script>
  <script src="./assets/vendor/purify.min.js"></script>
  <script src="./assets/js/markdown-view.js"></script>
  <script src="./assets/js/file-preview.js"></script>
  <script src="./assets/js/main.js"></script>
</body>

</html>
